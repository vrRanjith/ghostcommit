# Render Blueprint: the whole production setup as code.
# Secrets use `sync: false`, so Render asks for them in its dashboard; they never live in git.
#
# Free plans (no card needed). The daily haunter is triggered by .github/workflows/haunt.yml
# calling POST /internal/haunt, because Render has no free cron jobs. To move to paid plans,
# change `plan:` below and optionally add a `type: cron` service running `python -m app.haunter`.

databases:
  - name: ghostcommit-db
    databaseName: ghostcommit
    user: ghost
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    # No public access: only services on this Render account's private network can connect.
    ipAllowList: []

services:
  - type: web
    name: ghostcommit
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # Deploy only after the GitHub CI checks (tests + audits) pass on the commit.
    autoDeployTrigger: checksPass
    domains:
      - ghost.buildloop.tech
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ghostcommit-db
          property: connectionString
      - key: APP_URL
        value: https://ghost.buildloop.tech
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openrouter
      - key: MODEL_NAME
        value: google/gemma-4-31b-it
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: GhostCommit <ghost@buildloop.tech>
      # Bearer token the scheduled workflow sends; must match the GitHub Actions secret.
      - key: HAUNT_SECRET
        sync: false
