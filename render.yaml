# Render Blueprint: the whole production setup as code.
# Secrets use `sync: false`, so Render asks for them in its dashboard; they never live in git.

databases:
  - name: ghostcommit-db
    databaseName: ghostcommit
    user: ghost
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
    # No public access: only services on this Render account's private network can connect.
    ipAllowList: []

services:
  - type: web
    name: ghostcommit
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # Deploy only after the GitHub CI checks (tests + audits) pass on the commit.
    autoDeployTrigger: checksPass
    domains:
      - ghost.buildloop.tech
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ghostcommit-db
          property: connectionString
      - key: APP_URL
        value: https://ghost.buildloop.tech
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openrouter
      - key: MODEL_NAME
        value: google/gemma-4-31b-it
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: GhostCommit <ghost@buildloop.tech>

  # The haunter: same image, runs once a day and exits. 03:30 UTC = 09:00 IST.
  - type: cron
    name: ghostcommit-haunter
    runtime: docker
    plan: starter
    region: singapore
    schedule: "30 3 * * *"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m app.haunter
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ghostcommit-db
          property: connectionString
      - key: APP_URL
        value: https://ghost.buildloop.tech
      # Required by settings validation; the haunter never issues cookies.
      - key: SESSION_SECRET
        generateValue: true
      # Must be the SAME value as the web service's, or stored GitHub tokens can't be decrypted.
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openrouter
      - key: MODEL_NAME
        value: google/gemma-4-31b-it
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: GhostCommit <ghost@buildloop.tech>
